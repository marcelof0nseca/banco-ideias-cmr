# =============================================================================
# Banco de Ideias Legislativas - PRODUCAO. DONO: Pessoa B.
# Passo a passo completo em docs/implantacao/guia-ti.md.
#
#   1. cp .env.example .env    (e preencha os segredos - o .env fica fora do Git)
#   2. docker compose build
#   3. docker compose up -d --wait db
#   4. docker compose run --rm migrar            (aplica as migracoes do banco)
#   5. docker compose up -d --wait app
#
# O Nginx da Camara fica na frente (nginx/subdominio.conf ou proxy-portal.conf)
# e faz o TLS. Para desenvolvimento, use docker-compose.dev.yml.
# =============================================================================
name: banco-ideias

# NEXT_PUBLIC_* vao para dentro da imagem no build. O Docker Compose le o
# .env desta pasta e repassa aqui (sem valor no .env, vale o padrao).
x-build-args: &build-args
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bancodeideias.recife.pe.leg.br}
  NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
  NEXT_PUBLIC_URL_CAMARA: ${NEXT_PUBLIC_URL_CAMARA:-https://www.recife.pe.leg.br}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # So usuario e senha: o banco nao precisa (nem deve ver) as chaves do CPF.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: banco_ideias
    volumes:
      - banco_ideias_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d banco_ideias"]
      interval: 10s
      retries: 10
    # Sem "ports": o banco so e acessivel pela rede interna do compose.

  # Tarefas de manutencao (migracoes, criacao do administrador). Nao fica
  # ligado: roda e termina com "docker compose run --rm migrar ...".
  migrar:
    build: { context: ., target: migrar, args: *build-args }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    profiles: ["manutencao"]

  app:
    build: { context: ., target: app, args: *build-args }
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    # So o proprio servidor (Nginx) enxerga a aplicacao.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  banco_ideias_dados:
