# =============================================================================
# Cenario 2 - rota atras do portal institucional
#   https://www.recife.pe.leg.br/participacao-popular/banco-de-ideias
# Especificacao, secao 12.1.
#
# Neste cenario:
#   NEXT_PUBLIC_BASE_PATH="/participacao-popular/banco-de-ideias"
# A troca entre os dois cenarios NAO muda nenhuma linha de codigo - so a
# variavel de ambiente e qual arquivo Nginx e usado.
#
# Este bloco entra DENTRO do server{} ja existente do portal (que serve o
# Plone no restante das rotas). O cookie de sessao usa Path = basePath para
# nao colidir com os cookies do Plone.
# =============================================================================

location /participacao-popular/banco-de-ideias {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Cabecalhos de seguranca so para esta rota (o portal tem os seus).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
