# =============================================================================
# Cenario 1 (RECOMENDADO) - subdominio proprio
#   bancodeideias.recife.pe.leg.br
# Especificacao, secao 12.1.
#
# Neste cenario, NEXT_PUBLIC_BASE_PATH fica VAZIO.
# Modelo para a TI da Camara; TLS e emitido pela TI (Let's Encrypt ou
# certificado institucional).
# =============================================================================

upstream banco_ideias_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name bancodeideias.recife.pe.leg.br;
    # Redireciona todo HTTP para HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bancodeideias.recife.pe.leg.br;

    # --- TLS (ajustar caminhos aos certificados da Camara) ---
    ssl_certificate     /etc/ssl/camara/bancodeideias.crt;
    ssl_certificate_key /etc/ssl/camara/bancodeideias.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Cabecalhos de seguranca (secao 8.4) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Limite de taxa em camada de borda (complementa lib/limite.ts) ---
    # limit_req_zone definido no http{} principal; referencia aqui se usado.

    location / {
        proxy_pass http://banco_ideias_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
