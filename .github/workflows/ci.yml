# =============================================================================
# CI (especificacao, secao 11.3) - dono: Pessoa B.
# A cada push/PR:
#   verificar  - tipos, lint, testes e build (o "pronto" da dupla)
#   fumaca     - PostgreSQL real: migra, popula, sobe o servidor de producao e
#                confere rotas, protecao do painel e ausencia de dado pessoal
#   seguranca  - npm audit e varredura de segredos
#   conteiner  - sobe o docker-compose.yml (producao) e testa o sistema dentro
#                do contêiner (health, rotas, sem root, sem segredo na imagem)
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - name: Tipos, lint e testes
        run: npm run verificar
      - name: Build de producao
        run: npx next build

  fumaca:
    runs-on: ubuntu-latest
    needs: verificar
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bancoideias
          POSTGRES_PASSWORD: senhaci
          POSTGRES_DB: banco_ideias
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bancoideias" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bancoideias:senhaci@localhost:5432/banco_ideias?schema=public
      # Segredos so de teste, gerados a cada execucao.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Segredos de teste
        run: |
          for v in DOCUMENTO_CHAVE DOCUMENTO_PEPPER AUTH_SECRET; do
            echo "$v=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
          done
      - run: npm run db:generate
      - name: Migracoes (inclui a trava append-only da tramitacao)
        run: npx prisma migrate deploy
      - name: Carga de dados ficticios
        run: npm run db:seed
      - run: npx next build
      - name: Sobe o servidor de producao (o mesmo pacote que vai no contêiner)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (cd .next/standalone && PORT=3000 NODE_ENV=production node server.js > ../../servidor.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          cat servidor.log; exit 1
      - name: Rotas publicas respondem
        run: |
          for r in / /participar /consulta /acompanhar /indicadores /login /api/dados-abertos /api/indicadores; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$r")
            echo "$c $r"; test "$c" = "200"
          done
      - name: Painel exige login (307 para /login) e API exige sessao (401)
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/triagem)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/ideias/BIL-2026-000001/tramitar -H 'Content-Type: application/json' -d '{"destino":"EM_TRIAGEM","versao":0}')" = "401"
      - name: Cabecalhos de seguranca presentes
        run: |
          h=$(curl -sI http://localhost:3000/)
          echo "$h" | grep -qi "content-security-policy: .*nonce-"
          echo "$h" | grep -qi "x-frame-options: DENY"
          echo "$h" | grep -qi "strict-transport-security"
      - name: Nenhum dado pessoal em pagina ou dado publico
        run: |
          for r in /consulta /api/dados-abertos "/api/dados-abertos?formato=csv" /api/indicadores; do
            if curl -s "http://localhost:3000$r" | grep -Eqi '@exemplo|529\.982|52998224725'; then
              echo "DADO PESSOAL EXPOSTO em $r"; exit 1
            fi
          done
      - name: Trava append-only da tramitacao funciona no banco
        run: |
          if psql "${DATABASE_URL%%\?*}" -c 'DELETE FROM tramitacao' 2>/dev/null; then
            echo "DELETE em tramitacao deveria falhar"; exit 1
          fi

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Vulnerabilidades criticas bloqueiam
        run: npm audit --audit-level=critical
      - name: Vulnerabilidades altas (relatorio)
        # Hoje as altas vem so de CLIs de desenvolvimento (Prisma/shadcn),
        # comprovadamente fora do pacote de producao (.next/standalone).
        # Revisar quando o Prisma 8 sair do release candidate.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conteiner:
    # Sobe o sistema EXATAMENTE como a TI vai subir (docker-compose.yml e
    # docs/implantacao/guia-ti.md): gera as imagens, aplica as migracoes, liga o
    # contêiner, espera o HEALTHCHECK do Docker e confere o sistema la dentro.
    runs-on: ubuntu-latest
    needs: verificar
    env:
      COMPOSE: docker compose --profile manutencao
    steps:
      - uses: actions/checkout@v7
      - name: Segredos de teste (gerados agora, descartados no fim)
        run: |
          SENHA=$(openssl rand -hex 16)
          {
            echo "POSTGRES_USER=bancoideias"
            echo "POSTGRES_PASSWORD=$SENHA"
            echo "DATABASE_URL=postgresql://bancoideias:$SENHA@db:5432/banco_ideias?schema=public"
            echo "DOCUMENTO_CHAVE=$(openssl rand -base64 32)"
            echo "DOCUMENTO_PEPPER=$(openssl rand -hex 32)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            # Valor fora do padrao: prova que o .env chega ao build da imagem.
            echo "NEXT_PUBLIC_SITE_URL=http://ci.teste.local"
          } > .env
      - name: Gera as imagens (aplicacao e migracao)
        run: $COMPOSE build
      - name: Sobe o banco
        run: $COMPOSE up -d --wait db
      - name: Aplica as migracoes (contêiner "migrar")
        run: $COMPOSE run --rm migrar
      - name: Carga de dados ficticios
        run: $COMPOSE run --rm migrar npm run db:seed
      - name: Cria o administrador inicial (como no guia da TI)
        run: |
          set -e
          SENHA=$(openssl rand -hex 16)
          ADMIN="$COMPOSE run --rm -T migrar npm run --silent admin:criar --"
          printf '%s\n%s\n' "$SENHA" "$SENHA" | $ADMIN --nome "Admin CI" --email admin.ci@teste.local
          # E-mail repetido tem que ser recusado
          if printf '%s\n%s\n' "$SENHA" "$SENHA" | $ADMIN --nome "Admin CI" --email admin.ci@teste.local; then
            echo "deveria recusar e-mail repetido"; exit 1
          fi
          # Recuperacao de acesso
          printf '%s\n%s\n' "$SENHA-2" "$SENHA-2" | $ADMIN --redefinir --email admin.ci@teste.local
      - name: Liga a aplicacao e espera o HEALTHCHECK ficar "healthy"
        run: $COMPOSE up -d --wait --wait-timeout 180 app
      - name: Sistema responde de dentro do contêiner
        run: |
          set -e
          curl -sf http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          for r in / /participar /consulta /acompanhar /indicadores /login /api/dados-abertos; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$r")
            echo "$c $r"; test "$c" = "200"
          done
          curl -s http://127.0.0.1:3000/consulta | grep -q "Ciclovia protegida"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/triagem)" = "307"
          curl -sI http://127.0.0.1:3000/ | grep -qi "content-security-policy: .*nonce-"
      - name: Configuracao do .env chegou ao sistema (URL do site e fuso de Recife)
        run: |
          set -e
          P=$(curl -s http://127.0.0.1:3000/consulta | grep -o 'consulta/BIL-[0-9]*-[0-9]*' | head -1)
          echo "detalhe: $P"
          curl -s "http://127.0.0.1:3000/$P" | grep -q "http://ci.teste.local/$P"
          test "$($COMPOSE exec -T app node -e 'console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)')" = "America/Recife"
      - name: Contêiner seguro (sem root, sem segredo dentro da imagem)
        run: |
          set -e
          test "$($COMPOSE exec -T app id -u)" = "1001"
          IMAGEM=$($COMPOSE images -q app)
          ENV_IMAGEM=$(docker image inspect --format '{{json .Config.Env}}' "$IMAGEM")
          echo "$ENV_IMAGEM"
          if echo "$ENV_IMAGEM" | grep -Eq 'DOCUMENTO_CHAVE|DOCUMENTO_PEPPER|AUTH_SECRET|DATABASE_URL|POSTGRES_PASSWORD'; then
            echo "SEGREDO DENTRO DA IMAGEM"; exit 1
          fi
          if $COMPOSE exec -T app sh -c 'ls -a /app' | grep -E '^\.env'; then
            echo "ARQUIVO .env DENTRO DA IMAGEM"; exit 1
          fi
          if $COMPOSE exec -T db env | grep -Eq 'DOCUMENTO_|AUTH_SECRET'; then
            echo "CHAVE DO CPF OU DA SESSAO NO CONTEINER DO BANCO"; exit 1
          fi
      - name: Logs (so se falhar)
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Desliga e apaga tudo
        if: always()
        run: $COMPOSE down -v
